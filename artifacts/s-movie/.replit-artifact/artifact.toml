kind = "mobile"
previewPath = "/"
title = "S MOVIE ORIGINAL"
description = "A movie and series streaming app for browsing titles, watching trailers and streams, managing downloads, and continuing playback across devices."
version = "1.0.0"
id = "artifacts/s-movie"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23135

[services.development]
run = "pnpm --filter @workspace/s-movie run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/s-movie", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/s-movie", "run", "serve" ]

[services.env]
PORT = "23135"
BASE_PATH = "/"
